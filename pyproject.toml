[project]
name = "nfl-opening-audit"
version = "0.1.0"
description = "Reproducible one-game feasibility audit for receiver separation analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1.0", "numpy>=2.0", "plotly>=6.0", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

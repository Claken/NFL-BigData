# Served through the existing Cloudflare Tunnel; no public origin listener.
server {
    listen 127.0.0.1:8080;
    server_name nflbuddy.nix.zone;

    root /var/www/nflbuddy/current;
    index report.html;
    autoindex off;

    if ($http_x_forwarded_proto = http) {
        return 308 https://nflbuddy.nix.zone$request_uri;
    }

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/csv application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    access_log /var/log/nginx/nflbuddy.access.log;
    error_log /var/log/nginx/nflbuddy.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
